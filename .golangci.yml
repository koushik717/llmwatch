run:
  timeout: 5m

linters:
  enable:
    - errcheck       # Check for unchecked errors
    - govet          # Go vet
    - staticcheck    # Staticcheck
    - gosimple       # Simplification suggestions
    - ineffassign    # Detect ineffectual assignments
    - unused         # Detect unused code
    - goimports      # goimports (imports formatting)
    - misspell       # Spelling mistakes
    - revive         # Drop-in replacement for golint
    - godot          # Check that comments end with a period
    - exhaustive     # Check exhaustiveness of enum switches
    - noctx          # Detect http.Request without context
    - bodyclose      # Check http response body is closed
    - durationcheck  # Check for incorrect duration multiplications
    - exportloopref  # Check for pointers to enclosing loop variables
    - nilerr         # Detect returning nil error with non-nil check
    - prealloc       # Suggest slice preallocation

linters-settings:
  revive:
    rules:
      - name: exported
        disabled: false
  godot:
    scope: declarations
    period: true
  goimports:
    local-prefixes: github.com/llmwatch/llmwatch
  exhaustive:
    default-signifies-exhaustive: true

issues:
  exclude-rules:
    # Ignore err checks in test files.
    - path: _test\.go
      linters: [errcheck]
    # Allow panic in test helpers.
    - path: _test\.go
      linters: [revive]
      text: "exported func.*should have comment"
    # Ignore generated or mock files.
    - path: mock_.*\.go
      linters: [all]
  max-issues-per-linter: 50
  max-same-issues: 10
