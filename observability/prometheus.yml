global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: llmwatch

rule_files: []

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: llmwatch-api
    static_configs:
      - targets: [go-api:8080]
    metrics_path: /metrics
    scrape_interval: 10s

  - job_name: llmwatch-consumer
    static_configs:
      - targets: [go-consumer:9091]
    metrics_path: /metrics
    scrape_interval: 10s

  - job_name: kafka
    static_configs:
      - targets: [kafka:9092]
    scrape_interval: 30s

  - job_name: postgres
    static_configs:
      - targets: [postgres:5432]
    scrape_interval: 30s
