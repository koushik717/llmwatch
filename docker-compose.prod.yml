version: '3.8'

services:
  react-frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=""
    ports:
      - "80:80"

  simulator:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: sh -c "apk add git && go run ./cmd/simulator -api http://go-api:8080 -rps 5"
    depends_on:
      go-api:
        condition: service_healthy
